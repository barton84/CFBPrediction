name: Retrain model

# Full rebuild from 2019 to now: refits every weight, reruns the backtest, refits the
# weather adjustment and saves the preseason prior. Run it each August and whenever
# you want to refresh the backtest. Takes about 15-25 minutes.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 12 10 8 *"     # August 10 each year

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Retrain
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python pipeline/retrain.py
      - name: Weather history
        continue-on-error: true
        timeout-minutes: 15
        run: python pipeline/weather.py --backfill 600
      - name: Refresh this week
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python pipeline/run_daily.py
      - name: Commit
        run: |
          git config user.name "cfb-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data state
          git diff --cached --quiet || git commit -m "Retrain $(date -u +'%Y-%m-%d')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
