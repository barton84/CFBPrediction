name: Daily update

on:
  schedule:
    - cron: "45 11 * * *"
    - cron: "0 21 * * 5"
    - cron: "15 15 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run daily job
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python pipeline/run_daily.py
      - name: Commit data
        run: |
          git config user.name "cfb-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data state
          git diff --cached --quiet || git commit -m "Daily update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
